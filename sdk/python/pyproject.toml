[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meshdns-client"
version = "0.1.0"
description = "Python client for MeshDNS — the distributed capability mesh"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "trucore-ai" }]
dependencies = ["httpx>=0.25"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-httpx>=0.30"]

[tool.setuptools.packages.find]
include = ["meshdns_client*"]